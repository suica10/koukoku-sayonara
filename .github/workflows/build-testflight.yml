name: Build and upload to TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEAM_ID: F8X8H9J6AY
      KEYCHAIN_PATH: ${{ github.workspace }}/build/signing.keychain-db
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Generate Xcode project
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
      - name: Install signing assets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p build/signing ~/private_keys \
            ~/Library/MobileDevice/"Provisioning Profiles"
          printf %s "$ASC_PRIVATE_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          printf %s "$DIST_CERT_P12_BASE64" | base64 --decode > build/signing/dist.p12
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security import build/signing/dist.p12 -k "$KEYCHAIN_PATH" \
            -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
      - name: Inject DoH token
        env:
          DOH_TOKEN: ${{ secrets.DOH_TOKEN }}
        run: |
          set -euo pipefail
          sed -i '' "s/tf-REPLACE_ME/${DOH_TOKEN}/" App/AppConfig.swift
          grep -q "tf-REPLACE_ME" App/AppConfig.swift && { echo "token injection failed"; exit 1; } || true
      - name: Archive (automatic signing, provisioning updates allowed)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project KoukokuSayonara.xcodeproj -scheme KoukokuSayonara \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/KoukokuSayonara.xcarchive \
            -derivedDataPath build/DerivedData \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=F8X8H9J6AY \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            | tee build/archive.log
      - name: Export IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath build/KoukokuSayonara.xcarchive \
            -exportOptionsPlist scripts/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee build/export.log
          ls -la build/export
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH="$(ls build/export/*.ipa | head -n1)"
          echo "Uploading $IPA_PATH"
          xcrun altool --upload-app --type ios -f "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee build/upload.log
      - name: Retain exported IPA
        uses: actions/upload-artifact@v4
        with:
          name: koukoku-sayonara-ipa-${{ github.run_number }}
          path: build/export/*.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-diagnostics
          path: |
            build/archive.log
            build/export.log
            build/upload.log
          if-no-files-found: ignore
          retention-days: 7
